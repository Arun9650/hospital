<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0070d1" />
    <title>Offline · Aria Health</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        min-height: 100%; padding: 24px;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #f6f8fa; color: #1a1a1a;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        max-width: 420px; width: 100%; text-align: center;
        background: #fff; border: 1px solid #e7e7e7; border-radius: 20px;
        padding: 40px 28px; box-shadow: 0 10px 40px rgba(0,0,0,0.05);
      }
      .badge {
        width: 64px; height: 64px; margin: 0 auto 20px;
        display: flex; align-items: center; justify-content: center;
        background: #0070d1; border-radius: 16px;
      }
      h1 { font-size: 22px; font-weight: 500; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { margin: 0 0 24px; color: #666; font-size: 15px; line-height: 1.5; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: #0070d1; color: #fff; font-size: 15px; font-weight: 600;
        padding: 12px 22px; border-radius: 999px;
      }
      button:hover { background: #0064b7; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
          <path d="M12 21s-7-4.35-7-10a4 4 0 017-2.65A4 4 0 0119 11c0 5.65-7 10-7 10z" fill="#fff" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>Aria Health can't reach the network right now. Check your connection — your cached pages are still available.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
